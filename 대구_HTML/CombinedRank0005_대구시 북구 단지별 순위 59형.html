if(r.rank>=0&&r.rank<MAX_ROWS){ctx.fillStyle=cssv("--sub");ctx.textAlign="right";ctx.fillText(String(r.rank+1),PAD_L+RANK_W-6,cy);}
ctx.fillStyle=cssv("--fg");ctx.textAlign="left";ctx.fillText(fit(D.items[r.idx].n,nameW-16),PAD_L+RANK_W,cy);
if(r.chg){ctx.globalAlpha=r.alpha*r.ca;ctx.fillStyle=cssv(r.chg>0?"--up":"--dn");ctx.textAlign="right";ctx.fillText(r.chg>0?"\u25B2":"\u25BC",PAD_L+RANK_W+nameW-2,cy);ctx.globalAlpha=r.alpha;}
ctx.fillStyle=r.color;ctx.fillRect(bx,cy-ROW_H*0.34,bw,ROW_H*0.68);
ctx.fillStyle=cssv("--fg");ctx.textAlign="left";ctx.fillText(eok(r.val)+"\uC5B5",bx+bw+6,cy);
}

}
function resetStates(){var i;st=[];for(i=0;i<NI;i++)st.push({y:BOTTOM,a:0,w:0,val:0});}
function valueAt(S,i,lo,hi,f){var a=S[i][lo];if(a<0)return -1;if(f<=0||hi===lo)return a;var b=S[i][hi];if(b<0)return -1;return a+(b-a)*f;}
function layout(){
var nw=!!(window.matchMedia&&window.matchMedia("(max-width:600px)").matches),rh=nw?24:28,i,k;
if(rh!==ROW_H){k=rh/ROW_H;for(i=0;i<st.length;i++)st[i].y*=k;ROW_H=rh;BOTTOM=MAX_ROWS*ROW_H;}

}
function updPg(){var r=N>1?t/(N-1):1;if(r<0)r=0;if(r>1)r=1;document.getElementById("pgF").style.width=(r*100).toFixed(2)+"%";}

function seekAt(cx){var rc=document.getElementById("pgB").getBoundingClientRect();if(N<2||rc.width<=0)return;var r=(cx-rc.left)/rc.width;if(r<0)r=0;if(r>1)r=1;t=r*(N-1);step(0,true);}

function step(dt,snap){

var S=getSeries(mode),lo=Math.min(Math.floor(t),N-1),hi=Math.min(lo+1,N-1),f=t-lo,i,k,vals=new Array(NI),list=[],rank=new Array(NI),rows=[];
if(f<0)f=0;
for(i=0;i<NI;i++){vals[i]=inc(i)?valueAt(S,i,lo,hi,f):-1;rank[i]=-1;if(vals[i]>=0)list.push(i);}
list.sort(function(a,b){return vals[b]-vals[a]||a-b;});
var tm=0;
for(k=0;k<list.length&&k<MAX_ROWS;k++){rank[list[k]]=k;if(vals[list[k]]>tm)tm=vals[list[k]];}
if(snap)arrowForce=true;
if(arrowForce){arrowAge=1e9;lastLo=lo;arrowForce=false;}
else if(lo!==lastLo){arrowAge=0;lastLo=lo;}
else arrowAge+=dt;
var ca=Math.min(1,arrowAge/ARROW_MS),moving=ca<1;
var sc=Math.min(1,1/speedMul),kY=1-Math.exp(-dt/(TAU_Y*sc)),kA=1-Math.exp(-dt/(TAU_A*sc)),kW=1-Math.exp(-dt/(TAU_W*sc)),kM=1-Math.exp(-dt/(TAU_M*sc));
var cur=ranksAt(lo,mode),prev=lo>0?ranksAt(lo-1,mode):null;
if(snap||maxDisp<=0)maxDisp=tm;
else{maxDisp+=(tm-maxDisp)*kM;if(Math.abs(tm-maxDisp)>Math.max(1,tm*0.002))moving=true;}
for(i=0;i<NI;i++){
var s=st[i],v=vals[i],r=rank[i],ty=r>=0?r*ROW_H:BOTTOM,ta=r>=0?1:0;
if(v>=0)s.val=v;
if(snap){s.y=ty;s.a=ta;if(v>=0)s.w=v;}
else{
if(r>=0&&s.a<0.05)s.w=v;
s.y+=(ty-s.y)*kY;s.a+=(ta-s.a)*kA;
if(r>=0)s.w+=(v-s.w)*kW;
if(Math.abs(ty-s.y)>0.3||Math.abs(ta-s.a)>0.01)moving=true;
if(r>=0&&Math.abs(v-s.w)>Math.max(1,maxDisp*0.002))moving=true;
}
if(s.a>0.01){
var chg=0;
if(prev&&cur[i]>=0&&prev[i]>=0)chg=cur[i]<prev[i]?1:(cur[i]>prev[i]?-1:0);
rows.push({idx:i,rank:Math.round(s.y/ROW_H),y:s.y,val:s.val,w:s.w,alpha:s.a,color:color(i),chg:chg,ca:ca});
}
}
rows.sort(function(a,b){return a.y-b.y;});
var mi=Math.max(0,Math.min(N-1,Math.round(t)));
drawFrame({monthLabel:ym(D.months[mi]),rows:rows,maxVal:maxDisp});
updPg();
return moving;
}
function loop(now){

if(D.names){var ttlEl=document.getElementById("ttl");var ttlRest=D.band+" / \uB2E8\uAE30 "+D.shortMonths+"\uAC1C\uC6D4 \u00B7 \uC7A5\uAE30 "+D.longMonths+"\uAC1C\uC6D4 / ~"+ym(D.anchorYm);
if(D.cats){ttlEl.textContent=D.title+" ("+D.childUnit+") - "+ttlRest;}else if(D.names.length>24){ttlEl.textContent=D.title+" ("+D.childUnit+") - "+ttlRest;var ttl2=document.createElement("div");ttl2.style.cssText="font-size:12px;color:var(--sub);margin-top:2px";ttl2.textContent=D.names;ttlEl.appendChild(ttl2);}
else{ttlEl.textContent=D.title+": "+D.names+" "+D.childUnit+" - "+ttlRest;}}
var catBox=null,catL=null,catItems=[],catN=[],catBtnM=null,catExp=false,catW=-1;

function catChg(){rkc={s:{},l:{}};arrowForce=true;redraw();kick();}
function catMaxW(){if(catW>=0)return catW;var m=0,i,q,pf=ctx.font;try{ctx.font="12px "+FONT;for(i=0;i<D.cats.length;i++){q=ctx.measureText(D.cats[i]).width;if(q>m)m=q;}}catch(x){m=0;}try{ctx.font=pf;}catch(y){}if(!(m>0&&isFinite(m)))m=120;catW=Math.ceil(m)+4;return catW;}
function catLayout(){
