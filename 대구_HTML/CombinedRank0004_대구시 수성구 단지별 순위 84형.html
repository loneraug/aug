var dt=last?Math.min(now-last,100):16;last=now;
if(playing){t+=dt/MONTH_MS*speedMul;if(t>=N-1){t=N-1;playing=false;updBtn();}}
var mv=step(dt,false);
if(playing||mv)raf=requestAnimationFrame(loop);else last=0;
}
function kick(){if(!raf){last=0;raf=requestAnimationFrame(loop);}}
function redraw(){if(step(0,false))kick();}
function updBtn(){document.getElementById("bP").textContent=playing?"\uC77C\uC2DC\uC815\uC9C0":((t>=N-1&&N>1)?"\uB2E4\uC2DC \uC7AC\uC0DD":"\uC7AC\uC0DD");}
function setSpeed(v){speedMul=v;var b=document.querySelectorAll(".spd"),i;for(i=0;i<b.length;i++)b[i].className="spd"+(parseFloat(b[i].getAttribute("data-v"))===v?" on":"");}
var mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function applyTheme(th){theme=th;document.documentElement.setAttribute("data-theme",th);document.getElementById("bT").textContent=(th==="dark")?"\u2600":"\uD83C\uDF19";}
function toStart(){t=0;resetStates();step(0,true);}
function setMode(m){mode=m;document.getElementById("bS").className=(m==="s")?"on":"";document.getElementById("bL").className=(m==="l")?"on":"";arrowForce=true;redraw();kick();}
document.getElementById("ttl").textContent=D.title+" \uD558\uC704 \uB7AD\uD0B9 ("+D.childUnit+") - "+D.band+" / \uB2E8\uAE30 "+D.shortMonths+"\uAC1C\uC6D4 \u00B7 \uC7A5\uAE30 "+D.longMonths+"\uAC1C\uC6D4 / ~"+ym(D.anchorYm);
// [신규 추가] (v1.13-5) 종합랭킹 제목: 포함 범주 목록이 짧으면 1행, 길면 2행(1행=요약, 2행=범주 목록)
if(D.names){var ttlEl=document.getElementById("ttl");var ttlRest=D.band+" / \uB2E8\uAE30 "+D.shortMonths+"\uAC1C\uC6D4 \u00B7 \uC7A5\uAE30 "+D.longMonths+"\uAC1C\uC6D4 / ~"+ym(D.anchorYm);
if(D.cats){ttlEl.textContent=D.title+" ("+D.childUnit+") - "+ttlRest;}else if(D.names.length>24){ttlEl.textContent=D.title+" ("+D.childUnit+") - "+ttlRest;var ttl2=document.createElement("div");ttl2.style.cssText="font-size:12px;color:var(--sub);margin-top:2px";ttl2.textContent=D.names;ttlEl.appendChild(ttl2);}
else{ttlEl.textContent=D.title+": "+D.names+" "+D.childUnit+" - "+ttlRest;}}
var catBox=null,catL=null,catItems=[],catN=[],catBtnM=null,catExp=false,catW=-1;
function catFs(){if(document.documentElement.classList.contains("fs")){fsFit();redraw();}}
function catChg(){rkc={s:{},l:{}};arrowForce=true;redraw();kick();}
function catMaxW(){if(catW>=0)return catW;var m=0,i,q,pf=ctx.font;try{ctx.font="12px "+FONT;for(i=0;i<D.cats.length;i++){q=ctx.measureText(D.cats[i]).width;if(q>m)m=q;}}catch(x){m=0;}try{ctx.font=pf;}catch(y){}if(!(m>0&&isFinite(m)))m=120;catW=Math.ceil(m)+4;return catW;}
function catLayout(){
if(!catBox)return;
var n=D.cats.length,cw=catMaxW()+36,av=catBox.clientWidth,cols=av>0?Math.floor(av/cw):1,i,more;
if(cols<1)cols=1;if(cols>n)cols=n;
catL.style.gridTemplateColumns="repeat("+cols+",minmax(0,1fr))";
more=n>cols;
for(i=0;i<n;i++)catItems[i].style.display=(more&&!catExp&&i>=cols)?"none":"";
catBtnM.style.display=more?"":"none";
catBtnM.textContent=catExp?"\uc811\uae30":"\ub354\ubcf4\uae30";
}
function catSync(k){var e=catItems[k],on=catN[k]>0&&catOn[k]!==false;e.className="ci"+(on?" on":"")+(catN[k]>0?"":" dis");e.setAttribute("aria-checked",on?"true":"false");}
function catToggle(k){if(!(catN[k]>0))return;catOn[k]=(catOn[k]===false);catSync(k);catChg();}
function catAll(v){var k;for(k=0;k<D.cats.length;k++){if(catN[k]>0){catOn[k]=v;catSync(k);}}catChg();}
function catBtn(tx,fn){var b=document.createElement("button");b.type="button";b.textContent=tx;b.onclick=fn;return b;}
function catInit(){
var n=D.cats.length,k,g,e,bx,nm,bar,ctl=document.getElementById("ctl");
catBox=document.createElement("div");catBox.id="cats";
catL=document.createElement("div");catL.id="catL";catBox.appendChild(catL);
for(k=0;k<n;k++)catN.push(0);
for(k=0;k<NI;k++){g=D.items[k].g;if(g>=0&&g<n)catN[g]++;}
for(k=0;k<n;k++){
e=document.createElement("div");e.setAttribute("role","checkbox");
e.title=D.cats[k]+(catN[k]>0?"":" (\ub370\uc774\ud130 \uc5c6\uc74c)");
bx=document.createElement("span");bx.className="cb";
nm=document.createElement("span");nm.className="nm";nm.textContent=D.cats[k];
e.appendChild(bx);e.appendChild(nm);
if(catN[k]>0)e.tabIndex=0;else e.setAttribute("aria-disabled","true");
e.onclick=(function(q){return function(){catToggle(q);};})(k);
e.onkeydown=(function(q){return function(ev){if((ev.key===" "||ev.key==="Enter")&&!ev.altKey&&!ev.ctrlKey&&!ev.metaKey){ev.preventDefault();catToggle(q);}};})(k);
catOn[k]=true;catItems.push(e);catL.appendChild(e);catSync(k);
}
bar=document.createElement("div");bar.id="catC";
catBtnM=catBtn("",function(){catExp=!catExp;catLayout();catFs();});
bar.appendChild(catBtn("\uc804\uccb4 \uc120\ud0dd",function(){catAll(true);}));
bar.appendChild(catBtn("\uc804\uccb4 \ud574\uc81c",function(){catAll(false);}));
bar.appendChild(catBtnM);
catBox.appendChild(bar);
ctl.parentNode.insertBefore(catBox,ctl);
catLayout();
window.addEventListener("resize",catLayout);window.addEventListener("load",catLayout);
}
if(D.cats&&D.cats.length>0)catInit();
document.getElementById("bP").onclick=function(){
if(!playing){if(t>=N-1)toStart();playing=true;}else playing=false;
updBtn();kick();
};
document.getElementById("bR").onclick=function(){playing=false;toStart();updBtn();};
document.getElementById("bS").onclick=function(){setMode("s");};
document.getElementById("bL").onclick=function(){setMode("l");};
(function(){var p=document.getElementById("pgT");
p.onpointerdown=function(e){if(N<2||(e.button>0))return;seeking=true;seekResume=playing;playing=false;updBtn();try{p.setPointerCapture(e.pointerId);}catch(x){}seekAt(e.clientX);e.preventDefault();};
p.onpointermove=function(e){if(seeking)seekAt(e.clientX);};
p.onpointerup=function(e){if(seeking)seekAt(e.clientX);endSeek();};
p.onpointercancel=endSeek;p.onlostpointercapture=endSeek;})();
(function(){var b=document.querySelectorAll(".spd"),i;for(i=0;i<b.length;i++)b[i].onclick=(function(v){return function(){setSpeed(v);};})(parseFloat(b[i].getAttribute("data-v")));})();
document.getElementById("bT").onclick=function(){manualTheme=true;applyTheme(theme==="dark"?"light":"dark");redraw();};
if(mq){var onMq=function(e){if(!manualTheme){applyTheme(e.matches?"dark":"light");redraw();}};if(mq.addEventListener)mq.addEventListener("change",onMq);else if(mq.addListener)mq.addListener(onMq);}
document.getElementById("pgL").textContent=ym(D.months[0]);document.getElementById("pgR").textContent=ym(D.months[N-1]);
applyTheme(mq&&mq.matches?"dark":"light");
window.addEventListener("resize",redraw);
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function fsChg(){document.documentElement.classList.toggle('fs',!!fsEl());catLayout();fsFit();redraw();}
function fsToggle(){var d=document,e=d.documentElement,on=!!fsEl(),f=on?(d.exitFullscreen||d.webkitExitFullscreen):(e.requestFullscreen||e.webkitRequestFullscreen),p;if(!f)return;try{p=f.call(on?d:e);if(p&&p.catch)p.catch(function(){});}catch(x){}}
document.addEventListener('keydown',function(e){if(e.altKey&&!e.ctrlKey&&!e.shiftKey&&!e.metaKey&&(e.key==='Enter'||e.keyCode===13)){e.preventDefault();if(!e.repeat)fsToggle();}});
document.addEventListener('fullscreenchange',fsChg);document.addEventListener('webkitfullscreenchange',fsChg);
function fsFit(){var w=document.getElementById("wrap"),on=document.documentElement.classList.contains("fs")&&!(window.matchMedia&&window.matchMedia("(max-width:600px)").matches),k=1;if(on){k=Math.min(window.innerWidth/960,window.innerHeight/w.offsetHeight);if(!(k>0))k=1;}FSK=k;w.style.transform=on?"scale("+k+") translate(-50%,-50%)":"";}
window.addEventListener("resize",function(){if(document.documentElement.classList.contains("fs")){catLayout();fsFit();redraw();}});
resetStates();step(0,true);updBtn();
})();
</script></body></html>
