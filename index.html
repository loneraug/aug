<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>차트 목록</title>
<style>
body{margin:0;padding:16px;background:#fff;color:#000;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#wrap{max-width:720px;margin:0 auto}
h1{font-size:18px;margin:0 0 12px}
ul{list-style:none;padding:0;margin:0}
li{padding:10px 0;border-bottom:1px solid #ddd}
a{color:#0645ad;text-decoration:none;font-size:15px}
a:hover{text-decoration:underline}
small{display:block;color:#777;font-size:12px;margin-top:2px}
#msg{color:#777;font-size:14px}
</style></head><body><div id="wrap">
<h1>차트 목록</h1>
<div id="msg">목록을 불러오는 중...</div>
<ul id="list"></ul>
</div>
<script>
(function(){
  var host=location.hostname;            // 아이디.github.io
  var owner=host.split('.')[0];
  var repo=location.pathname.split('/')[1];
  var msg=document.getElementById('msg');
  var ul=document.getElementById('list');
  if(!repo||host.indexOf('github.io')<0){msg.textContent='GitHub Pages 주소에서 열어주세요.';return;}
  fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/')
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(items){
      var files=items.filter(function(f){
        return f.type==='file'&&/\.html?$/i.test(f.name)&&f.name.toLowerCase()!=='index.html';
      }).sort(function(a,b){return a.name<b.name?-1:1;});
      if(!files.length){msg.textContent='표시할 HTML 파일이 없습니다.';return;}
      msg.style.display='none';
      files.forEach(function(f){
        var li=document.createElement('li');
        var a=document.createElement('a');
        a.href=encodeURIComponent(f.name);
        a.textContent=f.name;
        var s=document.createElement('small');
        s.textContent=f.name;
        li.appendChild(a);
        li.appendChild(s);
        ul.appendChild(li);
        // 각 페이지의 <title>을 읽어 제목으로 표시
        fetch(a.href).then(function(r){return r.text();}).then(function(t){
          var m=t.match(/<title>([^<]*)<\/title>/i);
          if(m&&m[1].trim())a.textContent=m[1].trim();
        }).catch(function(){});
      });
    })
    .catch(function(){msg.textContent='목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';});
})();
</script>
</body></html>
